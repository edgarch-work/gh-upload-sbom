name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  verify:
    name: Verify Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify committed node_modules match package-lock.json
        run: |
          npm ci --ignore-scripts
          git diff --exit-code node_modules/ || \
            (echo "ERROR: node_modules does not match package-lock.json. Run 'npm ci' and commit the result." && exit 1)

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate
